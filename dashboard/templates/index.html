<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Arrhythmia Workstation | AI Dashboard</title>

    <style>
        :root {
            --bg-dark: #0a0a0a;
            --panel-bg: rgba(30, 30, 30, 0.6);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-primary: #00ff99;
            /* Neon Green */
            --accent-secondary: #00ccff;
            /* Neon Blue */
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000 100%);
            font-size: 15px;
            /* Base size up from default */
        }

        /* Glassmorphism Utilities */
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        #topBar {
            background: rgba(20, 20, 20, 0.8);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(5px);
        }

        #segmentInfo {
            font-size: 24px;
            /* +4px for visibility */
            font-weight: 600;
            color: var(--accent-secondary);
            text-shadow: 0 0 10px rgba(0, 204, 255, 0.3);
        }

        #annotationBadge {
            font-size: 12px !important;
        }

        #navButtons button {
            margin-left: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-color);
            color: white;
            transition: all 0.2s;
            font-size: 14px;
            /* +1px */
        }

        #navButtons button:hover {
            background: var(--accent-secondary);
            color: black;
            box-shadow: 0 0 10px var(--accent-secondary);
        }

        #uploadForm {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            /* +1px */
        }

        #uploadForm button {
            background: linear-gradient(45deg, #0077ff, #00ccff);
        }

        #mainContainer {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 60px);
            padding: 10px;
            gap: 10px;
            box-sizing: border-box;
        }

        #ecgArea {
            flex: 0 0 50%;
            padding: 0;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        #ecgCanvas {
            width: 100%;
            height: 100%;
            background-color: #050505;
            cursor: crosshair;
        }

        #infoArea {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            overflow-y: auto;
            min-height: 0;
            padding-bottom: 20px;
        }

        .card {
            background: rgba(40, 40, 40, 0.4);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .card h3 {
            margin: 0 0 12px 0;
            color: var(--accent-primary);
            font-size: 16px;
            /* +2px */
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 8px;
        }

        textarea,
        select,
        input[type="text"],
        input[type="number"] {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 8px;
            margin-top: 5px;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
            /* Explicit size */
        }

        select:focus,
        textarea:focus,
        input:focus {
            outline: none;
            border-color: var(--accent-secondary);
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            /* +1px */
            font-weight: 500;
            transition: transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        #probTable {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            /* +1px */
        }

        #probTable td {
            padding: 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        #probTable tr.highlight {
            color: var(--accent-primary);
            font-weight: bold;
        }

        /* Scanline effect for ECG */
        #ecgArea::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <div id="topBar">
        <div style="display:flex;align-items:center;gap:15px;">
            <div id="segmentInfo">
                SEGMENT <span id="segmentID">--</span>
                <span id="annotationBadge"
                    style="display:none; margin-left:10px; font-size:11px; background:var(--accent-primary); color:black; padding:2px 6px; border-radius:4px; font-weight:bold; vertical-align:middle;">
                    ✓ ANNOTATED
                </span>
            </div>
            <div id="navButtons" style="display:flex; align-items:center;">
                <button id="prevBtn">◀ Prev</button>
                <button id="nextBtn">Next ▶</button>

                <div style="margin-left:15px; display:flex; gap:5px; align-items:center;">
                    <input type="number" id="jumpInput" placeholder="#"
                        style="width:60px; padding:4px; font-size:12px; height:28px; margin:0;">
                    <button id="jumpBtn" style="padding:4px 10px; height:28px;">Go</button>
                </div>
            </div>
        </div>

        <div style="display:flex; align-items:center; gap:15px; font-size:13px;">
            <div class="glass-panel"
                style="padding:5px 10px; border-radius:6px; display:flex; align-items:center; gap:8px;">
                <label for="correctorName" style="color:var(--text-muted)">Annotator:</label>
                <input type="text" id="correctorName" placeholder="Dr. Cardio"
                    style="width:100px; padding:4px; margin:0; border:none; background:transparent; color:white; font-weight:bold;"
                    value="Cardiologist">
            </div>

            <form id="uploadForm" method="POST" action="/upload_and_process" enctype="multipart/form-data">
                <input type="file" name="file" id="fileInput" accept=".json" style="color:var(--text-muted)">
                <button type="submit">Upload JSON</button>
            </form>
        </div>
    </div>

    <!-- Retrain Bar -->
    <div style="padding: 0 20px; margin-top:10px; display:flex; justify-content:space-between; align-items:center;">
        <div id="retrainStatus" style="font-size:12px; font-family:monospace; color:var(--accent-primary);"></div>
        <button id="retrainBtn" style="background:#222; border:1px solid #444; font-size:11px;">🛠 Retrain Model (using
            corrections)</button>
    </div>

    <div id="mainContainer">
        <div id="ecgArea" class="glass-panel">
            <canvas id="ecgCanvas"></canvas>
        </div>

        <div id="infoArea">
            <!-- 1. Prediction -->
            <div class="card">
                <h3>AI Analysis</h3>
                <div id="arrLabel" style="font-size:16px; font-weight:bold; color:white; margin-bottom:10px;">Loading...
                </div>
                <div id="probTableContainer" style="overflow-y:auto; flex:1;"></div>
            </div>

            <!-- 2. Features -->
            <div class="card">
                <h3>Vitals & Features</h3>
                <div style="font-size:24px; font-weight:300; color:var(--accent-primary); margin-bottom:5px;">
                    <span id="hrValue">--</span> <span style="font-size:12px; color:var(--text-muted)">BPM</span>
                </div>
                <div
                    style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; font-size:13px; color:var(--text-muted);">
                    <div>PR Interval:<br><span id="prValue" style="color:white">--</span> ms</div>
                    <div>QRS Width:<br><span id="qrsValue" style="color:white">--</span> ms</div>
                </div>
                <div style="margin-top:15px; font-size:12px; line-height:1.4; color:#ccc;" id="xaiText">
                    (Explanation text)
                </div>
            </div>

            <!-- 3. Annotation Controls -->
            <div class="card">
                <h3>Expert Annotation</h3>
                <label style="font-size:11px; color:var(--text-muted)">Select Correct Diagnosis</label>
                <select id="annoLabel">
                    <!-- Javascript will populate this -->
                    <option value="">Loading...</option>
                </select>

                <div style="display:flex; gap:10px; margin-top:15px;">
                    <button id="saveAnnotationBtn" style="background:var(--accent-primary); color:black; flex:1;">Save
                        Only</button>
                    <button id="submitAndNextBtn" style="background:var(--accent-secondary); color:black; flex:1;">Save
                        & Next ➔</button>
                </div>
                <div id="annotationStatus" style="margin-top:8px; font-size:11px; text-align:center;"></div>
            </div>

            <!-- 4. Notes & R-Peaks -->
            <div class="card">
                <h3>Clinical Notes</h3>
                <textarea id="annoNotes" rows="3" placeholder="Add clinical observations..."></textarea>

                <h3 style="margin-top:15px; font-size:12px; border:none; padding:0;">R-Peak Locations (samples)</h3>
                <textarea id="annoRPeaks" rows="2"
                    style="font-family:monospace; font-size:11px; color:var(--text-muted);"></textarea>
            </div>
        </div>
    </div>

    <script>
        const INITIAL_SEGMENT_ID = {{ initial_segment_id }};
        const TARGET_FS = {{ TARGET_FS }};
    </script>

    <script>
        let currentSegment = INITIAL_SEGMENT_ID;
        const canvas = document.getElementById("ecgCanvas");
        const ctx = canvas.getContext("2d");

        let ecgSignal = [];
        let ecgRPeaksRaw = "";
        let saliencyData = [];
        let viewStart = 0;
        let viewEnd = 0;
        let isPanning = false;
        let lastX = 0;

        // ---- DYNAMIC DROPDOWN ----
        function populateDropdown(classes) {
            const sel = document.getElementById("annoLabel");
            // If already populated with items > 1 (loading is 1), skip
            if (sel.options.length > 2) return;

            sel.innerHTML = "";
            classes.forEach(c => {
                const opt = document.createElement("option");
                opt.value = c;
                opt.innerText = c;
                sel.appendChild(opt);
            });
        }

        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
            redrawECG();
        }
        window.addEventListener("resize", resizeCanvas);
        // Initial resize
        setTimeout(resizeCanvas, 100);

        function parseRPeaks(rpField) {
            if (!rpField) return [];
            const s = rpField.toString();
            if (s.trim() === "") return [];
            return s.split(",").map(x => parseInt(x.trim())).filter(x => !isNaN(x));
        }

        function drawGrid(ctx, w, h, startIdx, endIdx, minV, maxV) {
            ctx.save();
            ctx.clearRect(0, 0, w, h); // Clear for clean redraw

            const numSamples = endIdx - startIdx;

            // --- STANDARD ECG SCALING ENFORCEMENT ---
            // We want 1mV = X pixels AND 1s = 2.5 * X pixels (standard 25mm/s vs 10mm/mV)
            // But on a digital zoomable screen, we just want grid lines to align with UNITS.
            // Major Grid = 0.20s (5mm) / 0.5mV (5mm)
            // Minor Grid = 0.04s (1mm) / 0.1mV (1mm)

            // Vertical Scale (Voltage aka Y-axis)
            // We already have 'scaleY' passed implicitly via minV/maxV calc in redrawECG
            // Recalculate robustly here:
            const valueRange = maxV - minV;
            // scaleY is pixels per 1 Volt (because valueRange is in V/mV units)
            // Actually, values are usually in mV. Let's assume input signal is mV.
            // If scaleY = pixels per unit.
            const scaleY = h / (valueRange || 1);

            // Horizontal Scale (Time aka X-axis)
            // seconds displayed = numSamples / TARGET_FS
            const secondsVisible = numSamples / TARGET_FS;
            const pxPerSecond = w / secondsVisible;

            // Colors - Bright / Neon / Standard Pink Hybrid
            // Increased opacity and thickness for "Bright" request
            const colMajor = "rgba(255, 40, 110, 0.75)";  // Very Bright Pink/Red
            const colMinor = "rgba(255, 60, 120, 0.35)"; // Visible Faint Pink

            ctx.lineWidth = 1;

            // --- VERTICAL LINES (Time) ---
            // We iterate in time units (seconds)
            const startTime = startIdx / TARGET_FS;
            const endTime = endIdx / TARGET_FS;

            // Align to 0.04s grid
            const timeStep = 0.04;
            const startGridT = Math.floor(startTime / timeStep) * timeStep;

            for (let t = startGridT; t < endTime + timeStep; t += timeStep) {
                // Determine if Major (0.2s)
                // Use epsilon for float precision
                const isMajor = Math.abs((t / 0.2) - Math.round(t / 0.2)) < 0.001;

                const x = (t - startTime) * pxPerSecond;
                if (x < -1 || x > w + 1) continue;

                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, h);
                ctx.strokeStyle = isMajor ? colMajor : colMinor;
                ctx.lineWidth = isMajor ? 1.5 : 0.8; // Thicker lines
                ctx.stroke();
            }

            // --- HORIZONTAL LINES (Voltage) ---
            // Iterate in Voltage units
            // Align to 0.1mV grid
            const voltStep = 0.1;
            const startGridV = Math.floor(minV / voltStep) * voltStep;

            for (let v = startGridV; v < maxV + voltStep; v += voltStep) {
                // Determine if Major (0.5mV) - standard is 0.5mV blocks
                const isMajor = Math.abs((v / 0.5) - Math.round(v / 0.5)) < 0.001;

                // Map Voltage to Y pixel
                // Note: Standard ECG: Positive is UP. Canvas Y is DOWN.
                // y = h - (v - minV) * scaleY? 
                // Let's match the trace logic exactly:
                // In redrawECG: y = h/2 - (val - midV) * scaleY
                // Let's reverse-engineer or just map V to Y:

                // We know: h pixels covers [minV, maxV] roughly.
                // Center is midV = (minV+maxV)/2 which maps to h/2.
                const midV = (minV + maxV) / 2;
                const y = (h / 2) - (v - midV) * scaleY;

                if (y < -1 || y > h + 1) continue;

                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(w, y);
                ctx.strokeStyle = isMajor ? colMajor : colMinor;
                ctx.lineWidth = isMajor ? 1.5 : 0.8; // Thicker lines
                ctx.stroke();
            }

            ctx.restore();
        }

        function redrawECG() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (!ecgSignal || ecgSignal.length === 0) return;

            const w = canvas.width;
            const h = canvas.height;
            const N = ecgSignal.length;

            // Safety Bounds
            if (viewEnd <= viewStart) { viewStart = 0; viewEnd = N - 1; }
            if (viewStart < 0) viewStart = 0;
            if (viewEnd > N - 1) viewEnd = N - 1;

            const start = Math.floor(viewStart);
            const end = Math.floor(viewEnd);
            const visibleSamples = end - start;
            if (visibleSamples <= 1) return;

            // 1. Calculate Horizontal Scale
            const secondsVisible = visibleSamples / TARGET_FS;
            // pxPerSec = w / visibleSamples * TARGET_FS

            // 2. Vertical Scale: Auto-Fit with fixed margin (Standard Digital Oscilloscope)
            const seg = ecgSignal.slice(start, end + 1);
            let minV_seg = 9999, maxV_seg = -9999;
            for (let val of seg) {
                if (val < minV_seg) minV_seg = val;
                if (val > maxV_seg) maxV_seg = val;
            }
            if (minV_seg > maxV_seg) { minV_seg = -0.5; maxV_seg = 0.5; }

            let range = maxV_seg - minV_seg;
            if (range < 0.1) range = 0.1;

            // Fit ~2-3mV or the actual range if larger
            const fitRange = Math.max(range, 2.0);
            const scaleY = (h - 40) / fitRange;

            const midV = (minV_seg + maxV_seg) / 2;

            // Calculate Voltage Bounds for Grid
            const voltageSpan = h / scaleY;
            const yStartV = midV - (voltageSpan / 2);
            const yEndV = midV + (voltageSpan / 2);

            // Draw Grid
            drawGrid(ctx, w, h, start, end, yStartV, yEndV);

            // Saliency
            if (saliencyData && saliencyData.length === N) {
                const salSeg = saliencyData.slice(start, end + 1);
                const maxSal = Math.max(...salSeg, 0.01);
                const invMaxSal = 1 / maxSal;
                for (let i = 0; i < visibleSamples; i++) {
                    const x1 = (i / visibleSamples) * w;
                    const x2 = ((i + 1) / visibleSamples) * w;
                    const val = salSeg[i];
                    if (val > 0) {
                        const intensity = val * invMaxSal;
                        if (intensity > 0.3) {
                            ctx.fillStyle = `rgba(255, 200, 0, ${Math.min(intensity * 0.6, 0.5)})`;
                            ctx.fillRect(x1, 0, x2 - x1, h);
                        }
                    }
                }
            }

            // Trace
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#00ff99";
            ctx.shadowColor = "#00ff99";
            ctx.shadowBlur = 10;
            ctx.beginPath();

            const invVisible = 1 / visibleSamples;
            for (let i = 0; i < visibleSamples; i++) {
                const x = i * w * invVisible;
                const val = seg[i];
                const y = h / 2 - (val - midV) * scaleY;

                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            ctx.shadowBlur = 0;

            // R-Peaks
            const rpIdx = parseRPeaks(ecgRPeaksRaw);
            ctx.fillStyle = "rgba(255, 50, 50, 0.8)";
            rpIdx.forEach(idx => {
                if (idx >= start && idx <= end) {
                    const rel = idx - start;
                    const x = rel * w * invVisible;
                    const val = ecgSignal[idx];
                    const y = h / 2 - (val - midV) * scaleY;

                    ctx.fillRect(x - 3, y - 20, 6, 6);
                    ctx.font = "11px monospace";
                    ctx.fillText("R", x - 4, y - 25);
                }
            });
        }

        // Pan/Zoom Events
        canvas.addEventListener("wheel", (e) => {
            e.preventDefault();
            if (!ecgSignal || ecgSignal.length === 0) return;
            const N = ecgSignal.length;
            const length = viewEnd - viewStart + 1;

            if (e.ctrlKey) {
                // ZOOM (Time Axis)
                const zoomFactor = (e.deltaY < 0) ? 0.85 : 1.15;
                let newLength = length * zoomFactor;
                newLength = Math.max(200, Math.min(newLength, N));
                const center = (viewStart + viewEnd) / 2;
                let newStart = center - newLength / 2;
                let newEnd = center + newLength / 2;
                if (newStart < 0) { newStart = 0; newEnd = Math.min(newLength - 1, N - 1); }
                if (newEnd > N - 1) { newEnd = N - 1; newStart = Math.max(0, newEnd - newLength + 1); }
                viewStart = newStart;
                viewEnd = newEnd;
            } else {
                // PAN (Scroll Time)
                const shift = (e.deltaY > 0 ? 1 : -1) * (length * 0.1);
                let newStart = viewStart + shift;
                let newEnd = viewEnd + shift;

                if (newStart < 0) {
                    newEnd = newEnd - newStart;
                    newStart = 0;
                }
                if (newEnd > N - 1) {
                    newStart = newStart - (newEnd - (N - 1));
                    newEnd = N - 1;
                }
                if (newStart < 0) newStart = 0;

                viewStart = newStart;
                viewEnd = newEnd;
            }
            redrawECG();
        });

        canvas.addEventListener("mousedown", (e) => { isPanning = true; lastX = e.clientX; });
        window.addEventListener("mouseup", () => { isPanning = false; });
        window.addEventListener("mousemove", (e) => {
            if (!isPanning || !ecgSignal) return;
            const dx = e.clientX - lastX;
            lastX = e.clientX;
            const visibleLen = viewEnd - viewStart + 1;
            const fraction = dx / canvas.width;
            const shift = fraction * visibleLen;
            viewStart -= shift; viewEnd -= shift;
            redrawECG();
        });

        const FULL_CLASS_LIST = [
            "Sinus Rhythm", "Sinus Bradycardia", "Sinus Tachycardia", "Supraventricular Tachycardia",
            "Atrial Fibrillation", "Atrial Flutter", "Junctional Rhythm", "Idioventricular Rhythm",
            "Ventricular Tachycardia", "Ventricular Fibrillation", "1st Degree AV Block",
            "2nd Degree AV Block Type 1", "2nd Degree AV Block Type 2", "3rd Degree AV Block",
            "PVCs", "PVC Bigeminy", "PVC Trigeminy", "PVC Couplet",
            "PAC", "PAC Bigeminy", "PAC Trigeminy", "Bundle Branch Block", "Artifact",
            "Sinus Bradycardia + PVC", "Sinus Tachycardia + PVC", "Sinus Bradycardia + PAC",
            "Sinus Tachycardia + PAC", "Atrial Fibrillation + PVC", "Atrial Flutter + PVC",
            "1st Degree AV Block + PVC", "Sinus Bradycardia + PVC Bigeminy", "Sinus Tachycardia + PVC Bigeminy",
            "Atrial Couplet", "Atrial Run", "Ventricular Run", "NSVT", "PSVT", "Pause"
        ];

        function populateDropdown(serverClasses) {
            const sel = document.getElementById("annoLabel");
            // Only populate if empty or strictly necessary to avoid resetting user selection mid-edit
            if (sel.options.length > 5) return;

            sel.innerHTML = "";

            // Use server classes if provided, otherwise fallback to local full list
            const classesToUse = (serverClasses && serverClasses.length > 20) ? serverClasses : FULL_CLASS_LIST;

            classesToUse.forEach(c => {
                const opt = document.createElement("option");
                opt.value = c;
                opt.innerText = c;
                sel.appendChild(opt);
            });
        }

        function renderProbTable(classes, probs) {
            const container = document.getElementById("probTableContainer");

            // Ensure dropdown is populated with AT LEAST the model classes, or our full list if available
            populateDropdown(classes || FULL_CLASS_LIST);

            if (!classes || !probs || classes.length !== probs.length) {
                container.innerHTML = "<div style='color:#666;'>No data</div>";
                return;
            }

            let indices = Array.from(probs.keys()).sort((a, b) => probs[b] - probs[a]); // Sort desc

            let html = "<table id='probTable'><tbody>";
            for (let i = 0; i < Math.min(indices.length, 5); i++) { // Top 5
                let idx = indices[i];
                const p = probs[idx] * 100;
                const cls = (i === 0) ? "highlight" : "";
                html += `<tr class="${cls}"><td>${classes[idx]}</td><td style="text-align:right">${p.toFixed(1)}%</td></tr>`;
            }
            html += "</tbody></table>";
            container.innerHTML = html;
        }

        async function loadSegment(id) {
            try {
                const res = await fetch(`/api/segment/${id}`);
                const data = await res.json();
                if (data.error) { alert("Error: " + data.error); return; }

                currentSegment = data.segment_id;
                document.getElementById("segmentID").innerText = currentSegment;

                ecgSignal = data.raw_signal || [];
                ecgRPeaksRaw = data.r_peaks || "";
                viewStart = 0;
                viewEnd = ecgSignal.length > 0 ? ecgSignal.length - 1 : 0;
                redrawECG();

                // Vitals
                document.getElementById("hrValue").innerText = (data.mean_hr > 0) ? data.mean_hr.toFixed(0) : "--";
                document.getElementById("prValue").innerText = (data.pr_interval > 0) ? data.pr_interval.toFixed(0) : "--";
                document.getElementById("qrsValue").innerText = (data.qrs_mean_ms > 0) ? data.qrs_mean_ms.toFixed(0) : "--";

                // Annotation
                if (data.arrhythmia_label) {
                    document.getElementById("annoLabel").value = data.arrhythmia_label;
                }

                document.getElementById("annoRPeaks").value = data.r_peaks || "";
                document.getElementById("annoNotes").value = data.notes || "";

                // Show/Hide Annotated Badge
                const badge = document.getElementById("annotationBadge");
                if (data.corrected_by) {
                    badge.style.display = "inline-block";
                    badge.title = "Annotated by " + data.corrected_by + " on " + (data.corrected_at || "unknown date");
                } else {
                    badge.style.display = "none";
                }

                loadXAIExplanation(id);
            } catch (e) {
                console.error(e);
            }
        }

        async function loadXAIExplanation(id) {
            document.getElementById("arrLabel").innerText = "Analyzing...";
            const res = await fetch(`/api/xai/${id}`);
            const data = await res.json();

            if (data.classes) {
                populateDropdown(data.classes);
            }

            document.getElementById("arrLabel").innerText = data.pred_label || "Unknown";
            document.getElementById("xaiText").innerText = data.explanation || "";
            saliencyData = data.saliency || [];

            // --- AUTO-FILL ANNOTATION IF EMPTY ---
            // If the segment is NOT already annotated (badge hidden), default the dropdown to the AI's suggestion.
            const badge = document.getElementById("annotationBadge");
            const isAnnotated = (badge.style.display !== "none");

            if (!isAnnotated && data.pred_label) {
                const sel = document.getElementById("annoLabel");
                // Ensure the value exists in the dropdown before selecting
                let options = Array.from(sel.options).map(o => o.value);
                if (options.includes(data.pred_label)) {
                    sel.value = data.pred_label;
                }
            }

            redrawECG();
            if (data.classes && data.probs) {
                renderProbTable(data.classes, data.probs);
            }
        }

        // --- BUTTONS ---
        document.getElementById("prevBtn").onclick = async () => {
            const res = await fetch(`/api/prev_segment/${currentSegment}`);
            const d = await res.json();
            if (d.ok) loadSegment(d.prev);
        };
        document.getElementById("nextBtn").onclick = async () => {
            const res = await fetch(`/api/next_segment/${currentSegment}`);
            const d = await res.json();
            if (d.ok) loadSegment(d.next);
        };

        // Jump Button Logic
        document.getElementById("jumpBtn").onclick = () => {
            const val = document.getElementById("jumpInput").value;
            if (val) {
                loadSegment(parseInt(val));
            }
        };

        const saveAnnotation = async (loadNext) => {
            const payload = {
                segment_id: currentSegment,
                label: document.getElementById("annoLabel").value,
                r_peaks: document.getElementById("annoRPeaks").value,
                notes: document.getElementById("annoNotes").value,
                corrected_by: document.getElementById("correctorName").value
            };
            const res = await fetch(`/api/annotate`, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            const statusDiv = document.getElementById("annotationStatus");
            if (data.status === "success") {
                statusDiv.style.color = "var(--accent-primary)";
                statusDiv.innerText = "Saved Successfully";

                // Show Badge
                const badge = document.getElementById("annotationBadge");
                if (badge) {
                    badge.style.display = "inline-block";
                    badge.title = "Last annotated by " + payload.corrected_by;
                }

                if (loadNext) {
                    const r2 = await fetch(`/api/next_segment/${currentSegment}`);
                    const d2 = await r2.json();
                    if (d2.ok) loadSegment(d2.next);
                }
            } else {
                statusDiv.style.color = "red";
                statusDiv.innerText = "Save Failed: " + data.message;
            }
        };

        document.getElementById("saveAnnotationBtn").onclick = () => saveAnnotation(false);
        document.getElementById("submitAndNextBtn").onclick = () => saveAnnotation(true);

        document.getElementById("retrainBtn").onclick = async () => {
            const statusDiv = document.getElementById("retrainStatus");
            statusDiv.innerText = "Exporting & Retraining...";
            // 1. Export
            await fetch("/api/export_corrected");
            // 2. Retrain
            const res = await fetch("/api/retrain_model", { method: "POST" });
            const d = await res.json();
            if (d.error) statusDiv.innerText = "Error: " + d.error;
            else statusDiv.innerText = "Training Complete. Model Reloaded.";
        };

        // Start
        loadSegment(INITIAL_SEGMENT_ID);
    </script>
</body>

</html>
